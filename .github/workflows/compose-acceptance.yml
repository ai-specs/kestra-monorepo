name: Monorepo Compose acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: compose-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-24.04
    # Full 4-theme/English-Chinese/3-width business matrix; all 13 locales have key checks.
    # plus REST/MCP and timed no-side-effect checks, must finish without truncation.
    timeout-minutes: 360
    env:
      ADMIN_UI_REPORT_DIR: ${{ github.workspace }}/.work/admin-ui
      BB_BROWSER_DRIVER: ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout private submodules at root gitlinks using repository read-only keys
        env:
          OVERLAY_KEY: ${{ secrets.OVERLAY_READ_DEPLOY_KEY }}
          RBAC_KEY: ${{ secrets.RBAC_READ_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$OVERLAY_KEY" || { echo 'Missing OVERLAY_READ_DEPLOY_KEY'; exit 1; }
          test -n "$RBAC_KEY" || { echo 'Missing RBAC_READ_DEPLOY_KEY'; exit 1; }
          area=$(mktemp -d "$RUNNER_TEMP/monorepo-read-keys.XXXXXXXX")
          export MONOREPO_KEY_AREA="$area"
          cleanup_keys() {
            python3 - <<'PYKEY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          area = pathlib.Path(os.environ['MONOREPO_KEY_AREA'])
          assert area.parent.resolve() == root and area.name.startswith('monorepo-read-keys.') and not area.is_symlink()
          shutil.rmtree(area)
          PYKEY
          }
          trap cleanup_keys EXIT
          chmod 700 "$area"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$area/known_hosts"
          test -s "$area/known_hosts"
          checkout_pin() {
            local repo="$1" key="$2" commit mode type name
            read -r mode type commit name < <(git ls-tree HEAD -- "$repo")
            test "$mode" = 160000 && test "$type" = commit && test "$name" = "$repo"
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            printf '%s\n' "$key" > "$area/key"
            chmod 600 "$area/key"
            git init "$repo"
            git -C "$repo" remote add origin "git@github.com:ai-specs/$repo.git"
            GIT_SSH_COMMAND="ssh -i $area/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$area/known_hosts" git -C "$repo" fetch --depth=1 origin "$commit"
            git -C "$repo" checkout --detach "$commit"
            test "$(git -C "$repo" rev-parse HEAD)" = "$commit"
            rm "$area/key"
          }
          checkout_pin kestra-overlay "$OVERLAY_KEY"
          checkout_pin kestra-plugin-rbac "$RBAC_KEY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify root acceptance observer and browser-adapter regressions
        run: |
          set -euo pipefail
          mkdir -p .work/ci
          node --test scripts/tests/*.test.mjs > .work/ci/root-observer-adapter-tests.log 2>&1
      - uses: gradle/actions/setup-gradle@v4
      - name: Authenticate private published images
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$READ_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Verify tools and immutable composition inputs
        run: |
          set -euo pipefail
          mkdir -p .work/ci
          python3 scripts/check-access-control-prototype.py > .work/ci/access-control-prototype.json
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          version = subprocess.check_output(['docker', 'compose', 'version', '--short'], text=True).strip()
          match = re.match(r'v?(\d+)\.(\d+)\.(\d+)', version)
          assert match and tuple(map(int, match.groups())) >= (2, 24, 4), 'Docker Compose >= 2.24.4 required'
          def pin(file, key):
              values = [line.split('=', 1)[1].strip() for line in open(file) if line.startswith(key + '=')]
              assert len(values) == 1 and re.fullmatch(r'ghcr.io/ai-specs/kestra-overlay@sha256:[0-9a-f]{64}', values[0]), 'Invalid image digest'
              return values[0]
          image = pin('.env.example', 'KESTRA_IMAGE')
          plugin_image = pin('kestra-plugin-rbac/host-contract.properties', 'overlay.image')
          print(f'Deployment image: {image}')
          print(f'Plugin host image: {plugin_image}')
          pathlib.Path('.work/ci/composition-inputs.json').write_text(json.dumps({
              'deployment_image': image,
              'plugin_host_image': plugin_image,
              'compose_version': version,
          }, indent=2) + '\n')
          assert image == plugin_image, 'Deployment and plugin host contracts differ'
          with open('.work/ci/image', 'w') as stream:
              stream.write(image + '\n')
          PY
          git submodule status --recursive > .work/ci/submodules.log
          POSTGRES_PASSWORD=local-ci-only KESTRA_OIDC_UI_CLIENT_SECRET=local-ci-only docker compose --env-file .env.example config --format json > .work/ci/default-compose.json
          python3 scripts/check-default-multi-policy.py .work/ci/default-compose.json
          node --check scripts/blackbox-application-projects.mjs
          node --check scripts/application-project-browser-ci.cjs
      - name: Select and download independently published plugin artifact
        env:
          GH_TOKEN: ${{ secrets.APPLICATION_PROJECT_RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing APPLICATION_PROJECT_RELEASE_READ_TOKEN (Actions read access to both private release repositories)"; exit 1; }
          python3 scripts/select-application-project-release.py .work/ci
      - name: Install CI headless browser
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ci-browser" playwright@1.61.1
          "$RUNNER_TEMP/ci-browser/node_modules/.bin/playwright" install --with-deps chromium
          printf 'NODE_PATH=%s/ci-browser/node_modules\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Execute new-install application-project UI REST MCP acceptance
        env:
          GH_TOKEN: ${{ secrets.APPLICATION_PROJECT_RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          image=$(cat .work/ci/image)
          jar="$GITHUB_WORKSPACE/.work/ci/plugin-artifact/build/libs/kestra-rbac-authorizer.jar"
          hash=$(python3 -c 'import json; print(json.load(open(".work/ci/release-evidence.json"))["jarSha256"])')
          node scripts/blackbox-application-projects.mjs --run --browser ci \
            --image "$image" --jar "$jar" --sha256 "$hash" \
            --root "$GITHUB_WORKSPACE" --overlay "$GITHUB_WORKSPACE/kestra-overlay" \
            --plugin "$GITHUB_WORKSPACE/kestra-plugin-rbac" \
            --release-evidence .work/ci/release-evidence.json > .work/ci/application-project-driver.log 2>&1
      - name: Preserve application-project report after success or failure
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PYREPORT'
          import json, pathlib, shutil, tempfile
          log = pathlib.Path('.work/ci/application-project-driver.log')
          destination = pathlib.Path('.work/ci/application-projects')
          if log.exists():
              for line in reversed(log.read_text(errors='replace').splitlines()):
                  try:
                      value = json.loads(line)
                  except ValueError:
                      continue
                  if not isinstance(value, dict) or 'report' not in value:
                      continue
                  report = pathlib.Path(value['report']).resolve()
                  assert report.name == 'report.json' and report.parent.name.startswith('application-projects-bb-')
                  assert report.parent.parent == pathlib.Path(tempfile.gettempdir()).resolve()
                  destination.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(report, destination / 'report.json')
                  command_failures = report.parent / 'command-failures.log'
                  if command_failures.exists():
                      shutil.copy2(command_failures, destination / 'command-failures.log')
                  for phase in ['frozen-browser', 'browser']:
                      browser = report.parent / phase / 'browser-report.json'
                      if browser.exists():
                          shutil.copy2(browser, destination / (phase + '-report.json'))
                      diagnostics = report.parent / phase / 'diagnostics'
                      if diagnostics.exists():
                          for source in diagnostics.glob('*.json'):
                              assert source.resolve().is_relative_to(diagnostics.resolve()) and not source.is_symlink()
                              target = destination / phase / 'diagnostics' / source.name
                              target.parent.mkdir(parents=True, exist_ok=True)
                              shutil.copy2(source, target)
                      screenshots = report.parent / phase / 'screenshots'
                      if screenshots.exists():
                          for source in screenshots.rglob('*.png'):
                              assert source.resolve().is_relative_to(screenshots.resolve()) and not source.is_symlink()
                              target = destination / phase / 'screenshots' / source.relative_to(screenshots)
                              target.parent.mkdir(parents=True, exist_ok=True)
                              shutil.copy2(source, target)
                  # Never copy private fixture, Compose credentials or receipts.
                  break
          PYREPORT
      - name: Collect diagnostics and forcibly remove acceptance resources
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .work/ci
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          failed = False
          report_path = pathlib.Path('.work/ci/application-projects/report.json')
          report = json.loads(report_path.read_text()) if report_path.exists() else {}
          resources = report.get('resources', {})
          projects = {value for value in [resources.get('composeProject'), resources.get('missingExtension', {}).get('composeProject')] if value}
          assert all(re.fullmatch(r'application-projects-bb-[0-9]+-[0-9]+', value) for value in projects), 'Invalid current-run resource registration'
          result = subprocess.run(['docker', 'ps', '-aq'], capture_output=True, text=True, check=True)
          for container in result.stdout.split():
              project = subprocess.check_output(['docker', 'inspect', '-f', '{{index .Config.Labels "com.docker.compose.project"}}', container], text=True).strip()
              if project not in projects:
                  continue
              owner = subprocess.check_output(['docker', 'inspect', '-f', '{{index .Config.Labels "owner"}}', container], text=True).strip()
              assert owner == project, 'Current-run container ownership mismatch'
              logs = subprocess.run(['docker', 'logs', '--tail', '300', container], capture_output=True, text=True)
              text = logs.stdout + logs.stderr
              pathlib.Path(f'.work/ci/{container}.log').write_text(text)
              failed |= subprocess.run(['docker', 'rm', '-f', container]).returncode != 0
          for kind in ['network', 'volume']:
              listing = subprocess.check_output(['docker', kind, 'ls', '-q'], text=True)
              for resource in listing.split():
                  project = subprocess.check_output(['docker', kind, 'inspect', '-f', '{{index .Labels "com.docker.compose.project"}}', resource], text=True).strip()
                  if project in projects:
                      owner = subprocess.check_output(['docker', kind, 'inspect', '-f', '{{index .Labels "owner"}}', resource], text=True).strip()
                      assert owner == project, 'Current-run resource ownership mismatch'
                      failed |= subprocess.run(['docker', kind, 'rm', resource]).returncode != 0
          for file in pathlib.Path('.work/ci').glob('*.log'):
              lines = file.read_text(errors='replace').splitlines()
              file.write_text('\n'.join('[redacted credential-bearing line]' if re.search(r'token|password|secret|cookie|authorization|Bearer|eyJ[A-Za-z0-9_-]+\.|Passw0rd|ReaderPass|WriterPass|BlockedPass|MultiPass|ExactPass|local-ci-only', line, re.I) else line for line in lines) + '\n')
          assert not failed, 'Acceptance resource cleanup failed'
          PY
          docker logout ghcr.io
      - name: Verify persisted final report and cleanup
        run: |
          set -euo pipefail
          python3 - <<'PYFINAL'
          import hashlib, json, pathlib, subprocess
          path = pathlib.Path('.work/ci/application-projects/report.json')
          report = json.loads(path.read_text())
          assert report['finishedAt'] and report['resources']['cleaned'] is True
          assert report['resources']['containersCreated'] is True
          root_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          image = pathlib.Path('.work/ci/image').read_text().strip()
          release = json.loads(pathlib.Path('.work/ci/release-evidence.json').read_text())
          jar = pathlib.Path('.work/ci/plugin-artifact/build/libs/kestra-rbac-authorizer.jar')
          jar_hash = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert jar_hash == release['jarSha256'], 'Actual downloaded jar differs from selected formal release'
          inputs = {'image': image, 'jarSha256': jar_hash, 'rootCommit': root_commit}
          for name, path in [('overlay', 'kestra-overlay'), ('plugin', 'kestra-plugin-rbac')]:
              tree = subprocess.check_output(['git', 'ls-tree', root_commit, '--', path], text=True).split()
              assert tree[:2] == ['160000', 'commit'] and tree[3] == path
              actual = subprocess.check_output(['git', '-C', path, 'rev-parse', 'HEAD'], text=True).strip()
              assert actual == tree[2], 'Checkout differs from root gitlink'
              inputs[name + 'Commit'] = actual
          assert report['inputs'] == inputs, 'Persisted report does not match independently selected final inputs'
          subprocess.run(['node', 'scripts/check-application-project-report.mjs', str(path)] +
                         [inputs[key] for key in ['image','jarSha256','rootCommit','overlayCommit','pluginCommit']], check=True)
          PYFINAL
      - name: Sanitize artifact text even after diagnostic cleanup failure
        id: sanitize
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          roots = ['.work/ci', '.work/admin-ui', '.work/namespace', '.work/management', 'kestra-plugin-rbac/build/reports/tests', 'kestra-plugin-rbac/build/test-results']
          sensitive = re.compile(r'token|password|secret|cookie|authorization|Bearer|eyJ[A-Za-z0-9_-]+\.|Passw0rd|ReaderPass|WriterPass|BlockedPass|MultiPass|ExactPass|local-ci-only', re.I)
          published = pathlib.Path('.work/ci/plugin-artifact').resolve()
          credential_value = re.compile(r'Bearer\s+[A-Za-z0-9._~-]+|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|(?:password|client_secret|access_token|refresh_token)\s*=', re.I)
          for root in roots:
              for file in pathlib.Path(root).rglob('*'):
                  if not file.is_file() or file.suffix.lower() not in {'.log', '.txt', '.xml', '.html', '.json'}:
                      continue
                  if file.resolve().is_relative_to(published):
                      # Preserve downloaded formal report bytes and their hashes.
                      # Test names mentioning passwords are not credentials.
                      # A secret-shaped published input must fail before upload.
                      assert not credential_value.search(file.read_text(errors='replace')), f'Credential-shaped content in published input: {file}'
                      continue
                  if file.parent.name == 'diagnostics' and file.resolve().is_relative_to(pathlib.Path('.work/ci/application-projects').resolve()):
                      # Already redacted by the collector; retain exact snapshot bytes and hash.
                      assert not credential_value.search(file.read_text(errors='replace')), f'Credential-shaped content in diagnostic evidence: {file}'
                      continue
                  if file.suffix.lower() == '.json':
                      def scrub(value):
                          if isinstance(value, dict):
                              return {key: '[redacted]' if re.fullmatch(r'(?:access[_-]?token|refresh[_-]?token|id[_-]?token|client[_-]?secret|temporary[_-]?password|password|cookies?|authorization|private[_-]?key|csrf|interaction|code[_-]?verifier)', key, re.I) else scrub(item) for key, item in value.items()}
                          if isinstance(value, list):
                              return [scrub(item) for item in value]
                          if isinstance(value, str) and re.search(r'Bearer [A-Za-z0-9._~-]+|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|(?:password|client_secret|access_token|refresh_token)=', value, re.I):
                              return '[redacted credential-bearing text]'
                          return value
                      file.write_text(json.dumps(scrub(json.loads(file.read_text())), indent=2) + '\n')
                      continue
                  lines = file.read_text(errors='replace').splitlines(keepends=True)
                  file.write_text(''.join('[redacted credential-bearing line]\n' if sensitive.search(line) else line for line in lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.sanitize.outcome == 'success'
        with:
          name: compose-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .work/ci/
            .work/admin-ui/
            .work/management/**/api.json
            .work/management/**/ui-style.json
            .work/management/**/inputs.json
            .work/namespace/*/ui.json
            .work/namespace/*/*.report.json
            kestra-plugin-rbac/build/reports/tests/
            kestra-plugin-rbac/build/test-results/
            kestra-plugin-rbac/.integration/host-provenance.json
